name: Keep Render Backend Awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend to prevent sleep
        run: |
          curl -sSf https://mrdk.onrender.com/health || echo "Ping failed, server might be starting up"
